<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TDnet リアルタイムViewer</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 p-4">
    <h1 class="text-2xl font-bold mb-2 text-blue-400">📈 TDnet リアルタイム巡回</h1>
    <div id="status" class="text-sm text-slate-400 mb-6">読み込み中...</div>
    
    <div id="content" class="grid gap-4 max-w-2xl mx-auto"></div>

    <script>
        async function load() {
            try {
                const r = await fetch('data.json?t=' + Date.now());
                const data = await r.json();
                const status = document.getElementById('status');
                const content = document.getElementById('content');

                status.innerText = `最終更新: ${new Date().toLocaleTimeString()} (取得数: ${data.length}件)`;

                content.innerHTML = data.map(i => `
                    <div class="bg-slate-800 p-4 rounded-xl border border-slate-700 shadow-lg hover:border-blue-500 transition-colors">
                        <div class="flex justify-between items-start mb-2">
                            <span class="text-[10px] bg-slate-700 px-2 py-1 rounded text-slate-300 font-mono">${i.date}</span>
                            <span class="text-xs font-bold text-blue-300">${i.code}</span>
                        </div>
                        <div class="text-sm font-bold mb-1 text-slate-200">${i.name}</div>
                        <div class="text-base font-semibold mb-3 leading-snug">${i.title}</div>
                        <a href="${i.url}" target="_blank" class="inline-block w-full text-center bg-blue-600 hover:bg-blue-500 text-white text-sm py-2 rounded-lg font-bold transition-colors">
                            PDFを開く ↗
                        </a>
                    </div>
                `).join('');
            } catch (e) {
                document.getElementById('status').innerText = 'データ読み込みエラー';
            }
        }
        load();
    </script>
</body>
</html>
