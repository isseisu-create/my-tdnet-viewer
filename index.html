<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>TDnet Viewer</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white p-5">
    <h1 class="text-xl font-bold mb-4">TDnet 最新開示</h1>
    <div id="content" class="space-y-4">読み込み中...</div>

    <script>
        async function load() {
            try {
                // ファイル名を正確に指定（?t=でキャッシュを防止）
                const r = await fetch('data.json?t=' + Date.now());
                if (!r.ok) throw new Error('データファイルが見つかりません');
                const data = await r.json();
                document.getElementById('content').innerHTML = data.map(i => `
                    <div class="p-4 bg-slate-800 rounded shadow">
                        <div class="text-xs text-slate-400">${i.date}</div>
                        <div class="font-bold">${i.title}</div>
                        <a href="${i.url}" target="_blank" class="text-blue-400 text-sm">PDFを表示</a>
                    </div>
                `).join('');
            } catch (e) {
                document.getElementById('content').innerText = 'エラー: ' + e.message;
            }
        }
        load();
    </script>
</body>
</html>
